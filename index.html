<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIDRO-SENTINELA RO - Monitoramento Ambiental</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto p-6 md:p-8 max-w-6xl">
        <h1 class="text-4xl md:text-5xl font-bold text-center mb-12 text-gray-800 drop-shadow-lg">
            Hidro-Sentinela RO
            <span class="block text-xl text-gray-600 font-normal mt-2">Monitoramento de Rios | Auditoria Ambiental - TCE-RO</span>
        </h1>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <!-- Rio Madeira -->
            <div class="bg-white shadow-xl rounded-xl p-8 border-l-8 border-red-500 hover:shadow-2xl transition-shadow">
                <h2 class="text-2xl font-semibold text-gray-800 mb-6">Rio Madeira</h2>
                <div class="space-y-4">
                    <p class="text-lg"><strong>Nível:</strong> <span id="nivel-madeira" class="font-mono text-2xl text-blue-600 bg-blue-100 px-3 py-1 rounded-full">Carregando...</span></p>
                    <p><strong>Status:</strong> <span id="status-madeira" class="font-bold px-4 py-2 rounded-full text-white bg-gray-500 text-lg">Carregando...</span></p>
                </div>
            </div>
            <!-- Rio Machado -->
            <div class="bg-white shadow-xl rounded-xl p-8 border-l-8 border-orange-500 hover:shadow-2xl transition-shadow">
                <h2 class="text-2xl font-semibold text-gray-800 mb-6">Rio Machado</h2>
                <div class="space-y-4">
                    <p class="text-lg"><strong>Nível:</strong> <span id="nivel-machado" class="font-mono text-2xl text-blue-600 bg-blue-100 px-3 py-1 rounded-full">Carregando...</span></p>
                    <p><strong>Status:</strong> <span id="status-machado" class="font-bold px-4 py-2 rounded-full text-white bg-gray-500 text-lg">Carregando...</span></p>
                </div>
            </div>
            <!-- Rio Mamoré -->
            <div class="bg-white shadow-xl rounded-xl p-8 border-l-8 border-blue-500 hover:shadow-2xl transition-shadow">
                <h2 class="text-2xl font-semibold text-gray-800 mb-6">Rio Mamoré</h2>
                <div class="space-y-4">
                    <p class="text-lg"><strong>Nível:</strong> <span id="nivel-mamore" class="font-mono text-2xl text-blue-600 bg-blue-100 px-3 py-1 rounded-full">Carregando...</span></p>
                    <p><strong>Status:</strong> <span id="status-mamore" class="font-bold px-4 py-2 rounded-full text-white bg-gray-500 text-lg">Carregando...</span></p>
                </div>
            </div>
        </div>
        <!-- Tabela de Riscos -->
        <div class="bg-white shadow-2xl rounded-2xl overflow-hidden">
            <table class="w-full">
                <thead class="bg-gradient-to-r from-gray-800 to-gray-900 text-white">
                    <tr>
                        <th class="px-8 py-4 text-left font-semibold text-lg">Rio</th>
                        <th class="px-8 py-4 text-left font-semibold text-lg">Risco 2026</th>
                    </tr>
                </thead>
                <tbody id="risk-tbody" class="divide-y divide-gray-200">
                    <tr>
                        <td colspan="2" class="px-8 py-12 text-center text-gray-500 text-xl">Carregando riscos...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://biiizdpnskjjvafivnff.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpaWl6ZHBuc2tqanZhZml2bmZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzY5ODEsImV4cCI6MjA5MzY1Mjk4MX0.Q0YPxabDvjjf8PYMt7DwVRRgYvBnTNglSq8_D2hRTq4';

        // Configuração para evitar bloqueio de storage e erros de redeclaração
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey, {
            auth: { persistSession: false }
        });

        function setNivel(id, nivel) {
            const el = document.getElementById(id);
            if (el) el.textContent = nivel || 'N/A';
        }

        function setStatus(id, status) {
            const el = document.getElementById(id);
            if (!el) return;
            el.textContent = status || 'N/A';
            const lower = status?.toLowerCase() || '';
            let bgClass = 'bg-gray-500';
            if (lower.includes('crític') || lower.includes('critic')) bgClass = 'bg-red-600';
            else if (lower.includes('alto') || lower.includes('high')) bgClass = 'bg-orange-500';
            else if (lower.includes('médi') || lower.includes('medium')) bgClass = 'bg-yellow-500';
            else if (lower.includes('normal') || lower.includes('baixo') || lower.includes('low')) bgClass = 'bg-green-500';
            el.className = `font-bold px-4 py-2 rounded-full text-white text-lg ${bgClass}`;
        }

        async function loadData() {
            try {
                // Carrega dados dos rios
                const { data: riosData, error: riosError } = await supabaseClient
                    .from('monitoramento_rios')
                    .select('rio, nivel, status')
                    .order('created_at', { ascending: false });

                if (riosError) throw riosError;

                const madeira = riosData?.find(r => r.rio?.toUpperCase().includes('MADEIRA'));
                const machado = riosData?.find(r => r.rio?.toUpperCase().includes('MACHADO'));
                const mamore = riosData?.find(r => r.rio?.toUpperCase().includes('MAMORÉ') || r.rio?.toUpperCase().includes('MAMORE'));

                setNivel('nivel-madeira', madeira?.nivel);
                setStatus('status-madeira', madeira?.status);
                setNivel('nivel-machado', machado?.nivel);
                setStatus('status-machado', machado?.status);
                setNivel('nivel-mamore', mamore?.nivel);
                setStatus('status-mamore', mamore?.status);

                // Carrega riscos da view
                const { data: risksData, error: risksError } = await supabaseClient
                    .from('view_risco_2026')
                    .select('rio, risco');

                if (risksError) throw risksError;

                const tbody = document.getElementById('risk-tbody');
                if (risksData && risksData.length > 0) {
                    tbody.innerHTML = risksData.map(risk => `
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-8 py-6 font-medium text-gray-900">${risk.rio || 'N/A'}</td>
                            <td class="px-8 py-6">
                                <span class="font-bold px-4 py-2 rounded-full text-white ${getStatusClass(risk.risco)}">${risk.risco || 'N/A'}</span>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="2" class="px-8 py-12 text-center text-gray-500 text-xl">Nenhum risco encontrado</td></tr>';
                }
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
                const tbody = document.getElementById('risk-tbody');
                if (tbody) tbody.innerHTML = '<tr><td colspan="2" class="px-8 py-12 text-center text-red-500 text-xl">Erro ao carregar dados. Verifique o console.</td></tr>';
            }
        }

        function getStatusClass(status) {
            const lower = status?.toLowerCase() || '';
            if (lower.includes('crític') || lower.includes('critic')) return 'bg-red-600';
            if (lower.includes('alto') || lower.includes('high')) return 'bg-orange-500';
            if (lower.includes('médi') || lower.includes('medium')) return 'bg-yellow-500';
            if (lower.includes('normal') || lower.includes('baixo') || lower.includes('low')) return 'bg-green-500';
            return 'bg-gray-500';
        }

        window.addEventListener('load', loadData);
    </script>
</body>
</html>
