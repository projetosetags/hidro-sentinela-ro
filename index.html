<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HIDRO-SENTINELA RO - Monitoramento Ambiental</title>

<!-- 🔥 REMOVE ÍCONE 404 -->
<link rel="icon" href="data:,">

<!-- TAILWIND -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
}
.loading{
animation:pulse 1.5s infinite;
}
@keyframes pulse{
0%{opacity:1}
50%{opacity:.5}
100%{opacity:1}
}
</style>
</head>

<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">

<!-- APP -->
<div class="container mx-auto p-6 md:p-8 max-w-6xl">

<!-- HEADER -->
<h1 class="text-4xl md:text-5xl font-bold text-center mb-12 text-gray-800 drop-shadow-lg">
Hidro-Sentinela RO
<span class="block text-xl text-gray-600 font-normal mt-2">
Monitoramento de Rios | Auditoria Ambiental - TCE-RO
</span>
</h1>

<!-- CARDS -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">

<!-- MADEIRA -->
<div class="bg-white shadow-xl rounded-xl p-8 border-l-8 border-red-500 hover:shadow-2xl transition-all">
<h2 class="text-2xl font-semibold text-gray-800 mb-6">Rio Madeira</h2>

<div class="space-y-4">
<p class="text-lg">
<strong>Nível:</strong>
<span id="nivel-madeira" class="font-mono text-2xl text-blue-600 bg-blue-100 px-3 py-1 rounded-full loading">
Carregando...
</span>
</p>

<p class="text-lg">
<strong>Status:</strong>
<span id="status-madeira" class="font-bold px-4 py-2 rounded-full text-white bg-gray-500 text-lg loading">
Carregando...
</span>
</p>
</div>
</div>

<!-- MACHADO -->
<div class="bg-white shadow-xl rounded-xl p-8 border-l-8 border-orange-500 hover:shadow-2xl transition-all">
<h2 class="text-2xl font-semibold text-gray-800 mb-6">Rio Machado</h2>

<div class="space-y-4">
<p class="text-lg">
<strong>Nível:</strong>
<span id="nivel-machado" class="font-mono text-2xl text-blue-600 bg-blue-100 px-3 py-1 rounded-full loading">
Carregando...
</span>
</p>

<p class="text-lg">
<strong>Status:</strong>
<span id="status-machado" class="font-bold px-4 py-2 rounded-full text-white bg-gray-500 text-lg loading">
Carregando...
</span>
</p>
</div>
</div>

<!-- MAMORÉ -->
<div class="bg-white shadow-xl rounded-xl p-8 border-l-8 border-blue-500 hover:shadow-2xl transition-all">
<h2 class="text-2xl font-semibold text-gray-800 mb-6">Rio Mamoré</h2>

<div class="space-y-4">
<p class="text-lg">
<strong>Nível:</strong>
<span id="nivel-mamore" class="font-mono text-2xl text-blue-600 bg-blue-100 px-3 py-1 rounded-full loading">
Carregando...
</span>
</p>

<p class="text-lg">
<strong>Status:</strong>
<span id="status-mamore" class="font-bold px-4 py-2 rounded-full text-white bg-gray-500 text-lg loading">
Carregando...
</span>
</p>
</div>
</div>

</div>

<!-- TABELA -->
<div class="bg-white shadow-2xl rounded-2xl overflow-hidden">

<table class="w-full">

<thead class="bg-gradient-to-r from-gray-800 to-gray-900 text-white">
<tr>
<th class="px-8 py-4 text-left font-semibold text-lg">Rio</th>
<th class="px-8 py-4 text-left font-semibold text-lg">Risco 2026</th>
</tr>
</thead>

<tbody id="risk-tbody" class="divide-y divide-gray-200">
<tr>
<td colspan="2" class="px-8 py-12 text-center text-gray-500 text-xl">
Carregando riscos...
</td>
</tr>
</tbody>

</table>

</div>

</div>

<!-- SCRIPT -->
<script>

/* 🔥 SUPABASE */
const supabaseUrl='https://biiizdpnskjjvafivnff.supabase.co'

const supabaseAnonKey='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpaWl6ZHBuc2tqanZhZml2bmZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzY5ODEsImV4cCI6MjA5MzY1Mjk4MX0.Q0YPxabDvjjf8PYMt7DwVRRgYvBnTNglSq8_D2hRTq4'

const db=supabase.createClient(
supabaseUrl,
supabaseAnonKey,
{
auth:{
persistSession:false,
autoRefreshToken:false,
detectSessionInUrl:false
}
}
)

/* 🔥 STATUS */
function getStatusClass(status){

let s=String(status||"").toLowerCase()

if(
s.includes("crit")||
s.includes("emerg")||
s.includes("perigo")
){
return "bg-red-600"
}

if(
s.includes("alto")
){
return "bg-orange-500"
}

if(
s.includes("médi")||
s.includes("medio")
){
return "bg-yellow-500 text-black"
}

if(
s.includes("baixo")||
s.includes("normal")||
s.includes("seguro")
){
return "bg-green-600"
}

return "bg-gray-500"
}

/* 🔥 SET CARD */
function setRio(idNivel,idStatus,dado){

const nivelEl=document.getElementById(idNivel)
const statusEl=document.getElementById(idStatus)

if(!nivelEl || !statusEl)return

const nivel=
dado?.nivel_atual ??
dado?.nivel ??
dado?.cota ??
"N/A"

const status=
dado?.status_alerta ??
dado?.status ??
dado?.risco ??
"N/A"

nivelEl.textContent=nivel
nivelEl.classList.remove("loading")

statusEl.textContent=status
statusEl.className=`font-bold px-4 py-2 rounded-full text-white text-lg ${getStatusClass(status)}`
statusEl.classList.remove("loading")
}

/* 🔥 CARREGA DADOS */
async function loadData(){

try{

/* 🔥 MONITORAMENTO */
const {data,error}=await db
.from("monitoramento_rios")
.select("*")

if(error){
console.error(error)
throw error
}

console.log("MONITORAMENTO:",data)

/* 🔥 PROCURA RIOS */
const madeira=data.find(r=>
String(
r.nome_rio||
r.rio||
""
).toUpperCase().includes("MADEIRA")
)

const machado=data.find(r=>
String(
r.nome_rio||
r.rio||
""
).toUpperCase().includes("MACHADO")
)

const mamore=data.find(r=>
String(
r.nome_rio||
r.rio||
""
).toUpperCase().includes("MAMOR")
)

/* 🔥 ATUALIZA */
setRio(
"nivel-madeira",
"status-madeira",
madeira
)

setRio(
"nivel-machado",
"status-machado",
machado
)

setRio(
"nivel-mamore",
"status-mamore",
mamore
)

/* 🔥 RISCOS */
const riskBody=document.getElementById("risk-tbody")

const {data:riscos,error:riskError}=await db
.from("view_risco_2026")
.select("*")

if(riskError){
console.error(riskError)

riskBody.innerHTML=`
<tr>
<td colspan="2" class="px-8 py-10 text-center text-red-500 text-xl">
Erro ao carregar riscos
</td>
</tr>
`

return
}

console.log("RISCOS:",riscos)

if(!riscos || !riscos.length){

riskBody.innerHTML=`
<tr>
<td colspan="2" class="px-8 py-10 text-center text-gray-500 text-xl">
Nenhum risco encontrado
</td>
</tr>
`

return
}

riskBody.innerHTML=riscos.map(r=>{

const rio=
r.rio||
r.nome_rio||
r.nome||
"N/A"

const risco=
r.risco||
r.status||
r.nivel_risco||
"N/A"

return `
<tr class="hover:bg-gray-50 transition-all">
<td class="px-8 py-6 font-medium text-gray-900">
${rio}
</td>

<td class="px-8 py-6">
<span class="font-bold px-4 py-2 rounded-full text-white ${getStatusClass(risco)}">
${risco}
</span>
</td>
</tr>
`

}).join("")

}catch(err){

console.error("ERRO GERAL:",err)

const tbody=document.getElementById("risk-tbody")

tbody.innerHTML=`
<tr>
<td colspan="2" class="px-8 py-10 text-center text-red-600 text-xl">
Erro ao carregar dados do Supabase
</td>
</tr>
`

}
}

/* 🔥 START */
window.addEventListener(
"DOMContentLoaded",
loadData
)

</script>

</body>
</html>
